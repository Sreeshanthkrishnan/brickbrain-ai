name: Execute All 4 Test Suites & Export Excel Artifacts

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "all-tests-workflow"
  cancel-in-progress: false

jobs:
  all-4-test-suites:
    name: Run All 4 Test Suites & Export Excel Artifacts
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java JDK 21
      - name: 2. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 3: Setup Android SDK
      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Setup Node.js v22
      - name: 4. Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 5: Install Project Dependencies
      - name: 5. Install Dependencies
        run: npm ci

      # Step 6: Build Web Application & Android APK
      - name: 6. Build Web App & Android APK
        run: |
          npm run build
          npx cap sync android || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug || true
            cd ..
          fi

      # Step 7: Start Backend Server in Background
      - name: 7. Start Local Test Backend Server
        run: |
          node server.js &
          sleep 3

      # =========================================================================
      # TEST 1: Backend API, Security & Vulnerability Test Suite
      # =========================================================================
      - name: 🧪 Test 1 - Run Backend Security, API & Vulnerability Suite
        continue-on-error: true
        run: |
          echo "=== EXECUTING TEST 1: BACKEND SECURITY & API TEST SUITE ==="
          node test_suite.js || true
          node selenium_tests/utils/generate_security_docs.js || true

      # =========================================================================
      # TEST 2: Web Selenium E2E Test Suite
      # =========================================================================
      - name: 🧪 Test 2 - Run Web Selenium E2E Automation Suite
        continue-on-error: true
        env:
          BASE_URL: "http://localhost:3001"
          HEADLESS: "true"
        run: |
          echo "=== EXECUTING TEST 2: WEB SELENIUM E2E TEST SUITE ==="
          npm run test:selenium || node selenium_tests/runner.js || true
          node selenium-tests/tests/login-test.js || true

      # =========================================================================
      # TEST 3: Baseline Load & Performance Test Suite (100 VUs)
      # =========================================================================
      - name: 🧪 Test 3 - Run Baseline Load & Performance Test Suite
        continue-on-error: true
        env:
          BASE_URL: "http://localhost:3001"
        run: |
          echo "=== EXECUTING TEST 3: BASELINE LOAD & PERFORMANCE TEST SUITE ==="
          node load-tests/tests/load-test.js || true
          node selenium_tests/utils/generate_performance_docs.js || true

      # =========================================================================
      # TEST 4: Android Appium E2E Automation & APK Package Suite
      # =========================================================================
      - name: 🧪 Test 4 - Run Android Appium E2E & APK Package Verification Suite
        continue-on-error: true
        run: |
          echo "=== EXECUTING TEST 4: ANDROID APPIUM E2E AUTOMATION & APK SUITE ==="
          ls -la android/app/build/outputs/apk/debug/app-debug.apk || true
          node automation/runners/run_suite.js || true
          node selenium_tests/utils/generate_security_docs.js || true


      # =========================================================================
      # CONSOLIDATE ALL EXCEL REPORTS INTO STRUCTURED FOLDERS
      # =========================================================================
      - name: 📁 Consolidate All Test Excel Reports (.xlsx)
        if: always()
        run: |
          echo "Creating directory structure for consolidated Excel reports..."
          mkdir -p consolidated-excel-reports/1_Backend_Security_API
          mkdir -p consolidated-excel-reports/2_Selenium_Web_E2E
          mkdir -p consolidated-excel-reports/3_Load_Performance
          mkdir -p consolidated-excel-reports/4_Android_Appium_E2E

          # Test 1 Reports
          cp -f "Vulnerability Test Results"/*.xlsx consolidated-excel-reports/1_Backend_Security_API/ 2>/dev/null || true
          cp -f "selenium_tests/Vulnerability Test Results"/*.xlsx consolidated-excel-reports/1_Backend_Security_API/ 2>/dev/null || true

          # Test 2 Reports
          cp -f "selenium_tests/reports"/*.xlsx consolidated-excel-reports/2_Selenium_Web_E2E/ 2>/dev/null || true
          cp -f "selenium_tests/reports/excel"/*.xlsx consolidated-excel-reports/2_Selenium_Web_E2E/ 2>/dev/null || true
          cp -f "selenium-tests"/*.xlsx consolidated-excel-reports/2_Selenium_Web_E2E/ 2>/dev/null || true
          cp -f "selenium-tests/reports"/*.xlsx consolidated-excel-reports/2_Selenium_Web_E2E/ 2>/dev/null || true

          # Test 3 Reports
          cp -f "load-tests"/*.xlsx consolidated-excel-reports/3_Load_Performance/ 2>/dev/null || true
          cp -f "load-tests/reports"/*.xlsx consolidated-excel-reports/3_Load_Performance/ 2>/dev/null || true

          # Test 4 Reports
          cp -f "Test Results/Excel"/*.xlsx consolidated-excel-reports/4_Android_Appium_E2E/ 2>/dev/null || true
          cp -f "appium-tests"/*.xlsx consolidated-excel-reports/4_Android_Appium_E2E/ 2>/dev/null || true
          cp -f "appium-tests/reports"/*.xlsx consolidated-excel-reports/4_Android_Appium_E2E/ 2>/dev/null || true

          echo "Consolidated Excel Files Listing:"
          find consolidated-excel-reports/ -name "*.xlsx" || ls -R consolidated-excel-reports/

      # =========================================================================
      # UPLOAD ARTIFACT: ALL TEST EXCEL REPORTS (.XLSX)
      # =========================================================================
      - name: ⬇️ Upload Artifacts - Download All Test Excel Reports (.xlsx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: All-4-Test-Suites-Excel-Reports
          retention-days: 30
          path: |
            consolidated-excel-reports/
            **/*.xlsx

      # =========================================================================
      # PUBLISH STEP SUMMARY
      # =========================================================================
      - name: 📊 Publish GitHub Action Step Summary
        if: always()
        run: |
          echo "# 🎯 Unified Execution Summary: All 4 Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 4 test suites have completed execution. Excel test reports are available for direct download under Artifacts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📑 Downloadable Excel Reports Summary:" >> $GITHUB_STEP_SUMMARY
          echo "- **Test 1: Backend Security, API & Vulnerabilities** (\`findings.xlsx\`, \`endpoint-inventory.xlsx\`, \`test-cases.xlsx\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test 2: Selenium Web E2E Suite** (\`selenium-report.xlsx\`, \`Automation_Test_Report.xlsx\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test 3: Baseline Load & Performance Suite** (\`Baseline_Load_Test_100_VUs_Report.xlsx\`, \`Automation_Test_Report.xlsx\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Test 4: Android Appium E2E Automation Suite** (\`Execution_Summary.xlsx\`, \`Passed_Test_Cases.xlsx\`, \`Failed_Test_Cases.xlsx\`, \`Automation_Test_Report.xlsx\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⬇️ **Artifact Name:** \`All-4-Test-Suites-Excel-Reports\`" >> $GITHUB_STEP_SUMMARY
